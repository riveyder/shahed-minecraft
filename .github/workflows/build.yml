name: Build Minecraft 26.2 mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Validate editable model and resource references
        run: python3 docs/model/test_overhaul.py
      - name: Build without Minecraft runtime tests
        run: ./gradlew build -x check -x test -x runGameTest --no-daemon
      - name: Upload mod and sources
        uses: actions/upload-artifact@v4
        with:
          name: shahed-fpv-mayhem-mc26.2
          path: build/libs/*.jar
          if-no-files-found: error
